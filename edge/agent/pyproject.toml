[project]
name = "seetlu-agent"
version = "0.1.0"
description = "Seetlu edge agent: turns Frigate tracks into door/counter events"
requires-python = ">=3.12,<3.13"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
]

[project.scripts]
seetlu-agent = "seetlu_agent.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seetlu_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
