[project]
name = "seetlu-agent"
version = "0.1.0"
description = "Seetlu edge agent: turns Frigate tracks into door/counter events"
requires-python = ">=3.12,<3.13"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]

[project.scripts]
seetlu-agent = "seetlu_agent.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers>=4.9",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seetlu_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "S105", "S106", "E501"]
"seetlu_agent/setup_page.py" = ["E501"]  # inline HTML page

[tool.ruff.lint.isort]
known-first-party = ["seetlu_agent", "fake_frigate"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "../fake-frigate"  # tests replay the simulator's scenarios

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../fake-frigate"]
