[project]
name = "fake-frigate"
version = "0.1.0"
description = "Simulator publishing Frigate-shaped MQTT events and serving Frigate HTTP endpoints"
requires-python = ">=3.12,<3.13"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pyyaml>=6.0,<7",
]

[project.scripts]
fake-frigate = "fake_frigate.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
    "types-pyyaml>=6.0",
    "testcontainers>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fake_frigate"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
