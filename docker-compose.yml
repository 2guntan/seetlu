# Dev stack. `make up` starts everything; see README.md.
name: seetlu

x-backend: &backend
  build: ./backend
  env_file: [.env]
  volumes: ["./backend:/app"]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: seetlu
      POSTGRES_PASSWORD: seetlu
      POSTGRES_DB: seetlu
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seetlu -d seetlu"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  minio:
    # MinIO stopped publishing community images (Oct 2025); Chainguard's free build, pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio123}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  minio-init:
    build: ./backend
    env_file: [.env]
    command: python -m seetlu.storage.init_bucket
    depends_on: [minio]
    restart: "no"

  api:
    <<: *backend
    command: uvicorn seetlu.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 30

  worker:
    <<: *backend
    command: celery -A seetlu.workers.celery_app worker --loglevel=INFO --concurrency=2

  beat:
    <<: *backend
    command: celery -A seetlu.workers.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  mock-whatsapp:
    <<: *backend
    command: uvicorn seetlu.messaging.mock_inbox:app --host 0.0.0.0 --port 8025
    ports: ["8025:8025"]

  web:
    build: ./web
    environment:
      VITE_API_PROXY: http://api:8000
    ports: ["5173:5173"]
    volumes: ["./web/src:/app/src", "./web/index.html:/app/index.html"]
    depends_on: [api]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  fake-frigate:
    build: ./edge/fake-frigate
    environment:
      MQTT_HOST: mosquitto
    ports: ["5050:5000"]  # host 5000 is taken by macOS AirPlay
    depends_on: [mosquitto]

  agent:
    # The real seetlu-agent, fed by fake-frigate. SIM_CLOCK=1: it runs on the simulator clock.
    build: {context: ./edge, dockerfile: agent/Dockerfile}
    env_file: [.env]
    environment:
      MQTT_HOST: mosquitto
      FRIGATE_URL: http://fake-frigate:5000
      SIM_CLOCK: "1"
      AGENT_DATA_DIR: /data/agent
      FRIGATE_CONFIG_PATH: /data/frigate/config/config.yml
    ports: ["8080:8080"]  # LAN setup page (PIN = last 6 characters of KIT_CLAIM_TOKEN)
    volumes: ["agentdata:/data"]
    depends_on: [mosquitto, fake-frigate, api]

volumes:
  pgdata:
  miniodata:
  agentdata:
