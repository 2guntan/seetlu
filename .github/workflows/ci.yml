name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, edge/agent, edge/fake-frigate]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check-bundle
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint, unit tests, debug APK
        run: ./gradlew :shop-phone:ktlintCheck :shop-phone:testDebugUnitTest :shop-phone:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: shop-phone-debug-apk
          path: android/shop-phone/build/outputs/apk/debug/shop-phone-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: android/shop-phone/build/reports

  images:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  ops:
    # docs/11 M10: restore drill passes; the production stack comes up behind TLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x ops/backup/*.sh ops/vm/*.sh ops/tests/*.sh edge/os/*.sh edge/os/tests/*.sh
      - name: compose files are valid
        run: |
          cp .env.prod.example .env.prod && printf 'RAW_PRIVATE_KEY_B64=x\n' > .env.worker
          docker compose -f ops/docker-compose.prod.yml --env-file .env.prod config --quiet
      - name: restore drill
        run: ops/tests/restore-drill-test.sh
      - name: production smoke test
        run: ops/tests/prod-smoke.sh

  edge-os:
    # docs/11 M10: provision script tested on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: edge/os/tests/provision-test.sh

  security:
    # docs/09: dependency and container image scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (lockfiles)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - run: docker build -q -t seetlu-backend:scan backend
      - name: backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: seetlu-backend:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
